name: Apply AI quality preview

on:
  push:
    branches:
      - preview/ai-quality-thinking
    paths:
      - .github/scripts/apply-ai-quality-preview.py
      - .github/workflows/apply-ai-quality-preview.yml

permissions:
  contents: write

concurrency:
  group: ai-quality-preview
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lesson and LAS quality enhancements
        run: python3 .github/scripts/apply-ai-quality-preview.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build validation
        run: npm run build

      - name: Commit validated preview implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-ai-quality-preview.py
          rm -f .github/workflows/apply-ai-quality-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enhance subject-general AI planning and thinking controls"
          git push origin HEAD:preview/ai-quality-thinking
